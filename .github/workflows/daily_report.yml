name: Daily Report Automation

on:
  schedule:
    # GitHub Actions는 정각에 지연될 수 있어, KST 정시 뒤 7분·17분에 백업 실행합니다.
    # Render 주 스케줄은 08:05·12:05·15:05, 아래 백업은 08:07/17·12:07/17·15:07/17 KST입니다.
    - cron: '7,17 23 * * *'
    - cron: '7,17 3 * * *'
    - cron: '7,17 6 * * *'
  workflow_dispatch:
    inputs:
      edition:
        description: '발행 회차'
        required: true
        default: 'pre_open'
        type: choice
        options:
          - pre_open
          - intraday
          - closing_next_day

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai supabase python-dotenv yfinance

      - name: Resolve report edition
        id: edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_EDITION: ${{ inputs.edition }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            edition="$MANUAL_EDITION"
          elif [ "$SCHEDULE" = "7,17 23 * * *" ]; then
            edition="pre_open"
          elif [ "$SCHEDULE" = "7,17 3 * * *" ]; then
            edition="intraday"
          else
            edition="closing_next_day"
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"

      - name: Run Gemini report generator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_REPORT: "true"
          REPORT_EDITION: ${{ steps.edition.outputs.edition }}
        run: |
          python app/services/report_generator.py
