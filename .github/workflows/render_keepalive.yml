name: Render Health Check

on:
  schedule:
    # GitHub Actions cron은 UTC 기준이며 실행 시각이 지연될 수 있습니다.
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  # 별도 저장소 변수가 있으면 우선 사용하고, 없으면 기본 Render 서비스 주소를 사용합니다.
  HEALTH_URL: ${{ vars.RENDER_HEALTH_URL || 'https://insight-now-app.onrender.com/health' }}

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call Render health endpoint
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status_code="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --retry 2 --retry-delay 3 \
            --output "$response_file" --write-out '%{http_code}' \
            "$HEALTH_URL")"
          echo "HTTP status: $status_code"
          cat "$response_file"
          test "$status_code" -ge 200
          test "$status_code" -lt 400
