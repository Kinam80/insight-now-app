<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Insight Now 관리자</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #007bff; margin-bottom: 30px; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 10px; color: #444; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        button:hover { background: #0056b3; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Insight Now 관리자 페이지</h1>
        
        <div id="login-form">
            <h2>관리자 로그인</h2>
            <input type="email" id="email" placeholder="이메일" value="test@test.com">
            <input type="password" id="password" placeholder="비밀번호" value="test1234">
            <button onclick="login()">로그인</button>
        </div>
        
        <div id="post-form" style="display:none;">
            <h2>📝 새 분석 글 작성</h2>
            <input type="text" id="title" placeholder="제목을 입력하세요">
            <input type="text" id="preview" placeholder="미리보기 요약 입력">
            <textarea id="content" placeholder="본문 내용을 상세히 작성하세요" rows="10"></textarea>
            
            <div class="form-group">
                <label for="access_type"><b>공개 등급 설정:</b></label>
                <select id="access_type" onchange="togglePriceInput()">
                    <option value="free">무료</option>
                    <option value="premium_only">구독자 전용</option>
                    <option value="paid_single">단건 결제</option>
                </select>
            </div>
            
            <div id="price-group" style="display:none;">
                <input type="number" id="single_price" placeholder="단건 판매 가격 (원)">
            </div>
            
            <button onclick="createPost()">발행하기</button>
        </div>
    </div>
    
    <script>
        // 클라우드 서버 주소 (상수화하여 관리)
        const API_BASE = "https://insight-now-app.onrender.com";

        function togglePriceInput() {
            const accessType = document.getElementById('access_type').value;
            const priceGroup = document.getElementById('price-group');
            priceGroup.style.display = (accessType === 'paid_single') ? 'block' : 'none';
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (!res.ok) {
                    alert('로그인 실패: 이메일 또는 비밀번호를 확인하세요.');
                    return;
                }
                
                const data = await res.json();
                localStorage.setItem('token', data.access_token);
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('post-form').style.display = 'block';
            } catch (err) {
                alert('서버 연결 실패! Render 서버 상태를 확인하세요.');
            }
        }
        
        async function createPost() {
            const token = localStorage.getItem('token');
            const accessType = document.getElementById('access_type').value;
            const priceVal = document.getElementById('single_price').value;
            
            const body = {
                title: document.getElementById('title').value,
                preview: document.getElementById('preview').value,
                content: document.getElementById('content').value,
                access_type: accessType,
                single_price: accessType === 'paid_single' ? parseInt(priceVal) : null
            };
            
            try {
                const res = await fetch(`${API_BASE}/posts/admin/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(body)
                });
                
                if (res.ok) {
                    alert('🎉 분석 글 발행 완료!');
                    // 폼 초기화 로직
                    ['title', 'preview', 'content', 'single_price'].forEach(id => document.getElementById(id).value = '');
                } else {
                    const errData = await res.json();
                    alert('오류 발생: ' + (errData.detail || res.statusText));
                }
            } catch (err) {
                alert('요청 전송 실패!');
            }
        }
    </script>
</body>
</html>
