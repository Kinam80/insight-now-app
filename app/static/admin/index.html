<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Insight Now 관리자</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }

        h2 {
            color: #667eea;
            margin: 30px 0 20px 0;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        /* 로그인 폼 */
        #login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #login-form input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        #login-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 글 작성 폼 */
        #post-form {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        textarea,
        select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 200px;
        }

        select {
            cursor: pointer;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.logout {
            background: #ff6b6b;
            margin-top: 20px;
        }

        button.logout:hover {
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.4);
        }

        /* 메시지 */
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        /* 글 목록 */
        #posts-list {
            display: none;
            margin-top: 30px;
        }

        .post-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .post-item h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .post-item p {
            color: #666;
            margin: 5px 0;
            font-size: 0.9em;
        }

        .post-meta {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.85em;
            color: #999;
        }

        /* 통계 */
        #stats {
            display: none;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .stat-item {
            display: inline-block;
            width: 48%;
            margin: 10px 1%;
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
        }

        .stat-label {
            color: #999;
            margin-top: 5px;
            font-size: 0.9em;
        }

        /* 반응형 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .stat-item {
                width: 100%;
                margin: 10px 0;
            }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Insight Now 관리자 페이지</h1>

        <div id="message" class="message"></div>

        <div id="login-form">
            <h2>🔐 로그인</h2>
            <input type="email" id="email" placeholder="이메일">
            <input type="password" id="password" placeholder="비밀번호">
            <button onclick="login()">로그인</button>
        </div>

        <div id="post-form">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">📝 새 분석 글 작성</h2>
                <button class="logout" onclick="logout()">로그아웃</button>
            </div>

            <input type="text" id="title" placeholder="제목 (필수)">
            <input type="text" id="preview" placeholder="미리보기 (필수)">
            <textarea id="content" placeholder="본문 내용 (필수)"></textarea>

            <div class="form-row">
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #666; font-weight: bold;">접근 방식</label>
                    <select id="access_type" onchange="updatePriceField()">
                        <option value="free">무료</option>
                        <option value="premium_only">구독자 전용</option>
                        <option value="paid_single">단건 결제</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #666; font-weight: bold;">가격</label>
                    <input type="number" id="single_price" placeholder="단건 가격 (결제형만)" disabled>
                </div>
            </div>

            <input type="text" id="tags" placeholder="태그 (쉼표로 구분: AI, 나스닥, 분석)">

            <button onclick="createPost()">📤 발행하기</button>

            <div id="etf-management" style="margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;">
                <h2>📊 ETF 종목 관리</h2>
                
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="new-etf-ticker" placeholder="티커 입력 (예: QQQ)" style="flex: 1;">
                    <button onclick="addEtf()" style="background: #3498db;">➕ 추가</button>
                </div>

                <div id="etf-list" style="margin-bottom: 20px;">
                    </div>

                <button onclick="updateAllEtfData()" style="background: #27ae60; width: 100%;">🔄 전체 데이터 새로고침</button>
                <div id="etf-status" style="color: #666; font-size: 0.9em; text-align: center; margin-top: 5px;"></div>
            </div>

            <div id="posts-list">
                <h2>📋 작성한 글 목록</h2>
                <div id="posts-container"></div>
            </div>

            <div id="stats">
                <h2>📈 통계</h2>
                <div class="stat-item">
                    <div class="stat-number" id="total-posts">0</div>
                    <div class="stat-label">작성한 글</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="total-sales">₩0</div>
                    <div class="stat-label">총 매출</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://insight-now-app.onrender.com';

        // 로그인
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showMessage('이메일과 비밀번호를 입력해주세요.', 'error');
                return;
            }

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    showMessage('로그인 실패: ' + (data.detail || '확인해주세요'), 'error');
                    return;
                }

                if (data.user.role !== 'admin') {
                    showMessage('관리자 계정이 아닙니다.', 'error');
                    return;
                }

                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));

                document.getElementById('login-form').style.display = 'none';
                document.getElementById('post-form').style.display = 'flex';

                showMessage('로그인 성공!', 'success');
                loadPosts();
            } catch (err) {
                showMessage('오류: ' + err.message, 'error');
            }
        }

        // 로그아웃
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            document.getElementById('login-form').style.display = 'flex';
            document.getElementById('post-form').style.display = 'none';
            document.getElementById('posts-list').style.display = 'none';
            document.getElementById('stats').style.display = 'none';
            showMessage('로그아웃했습니다.', 'success');
        }

        // 가격 입력필드 활성화/비활성화
        function updatePriceField() {
            const accessType = document.getElementById('access_type').value;
            const priceField = document.getElementById('single_price');
            priceField.disabled = accessType !== 'paid_single';
            if (accessType !== 'paid_single') {
                priceField.value = '';
            }
        }

        // 글 작성
        async function createPost() {
            const token = localStorage.getItem('token');
            const title = document.getElementById('title').value;
            const preview = document.getElementById('preview').value;
            const content = document.getElementById('content').value;
            const accessType = document.getElementById('access_type').value;
            const tagsStr = document.getElementById('tags').value;
            const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()) : [];

            if (!title || !preview || !content) {
                showMessage('제목, 미리보기, 본문을 모두 입력해주세요.', 'error');
                return;
            }

            const body = {
                title,
                preview,
                content,
                access_type: accessType,
                single_price: accessType === 'paid_single' 
                    ? parseInt(document.getElementById('single_price').value) 
                    : null,
                tags
            };

            try {
                const res = await fetch(`${API_URL}/posts/admin/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (!res.ok) {
                    showMessage('오류: ' + (data.detail || data.message), 'error');
                    return;
                }

                showMessage('✅ 글 발행 완료!', 'success');
                document.getElementById('title').value = '';
                document.getElementById('preview').value = '';
                document.getElementById('content').value = '';
                document.getElementById('tags').value = '';
                document.getElementById('access_type').value = 'free';
                updatePriceField();

                loadPosts();
            } catch (err) {
                showMessage('오류: ' + err.message, 'error');
            }
        }

        // 글 목록 로드
        async function loadPosts() {
            const token = localStorage.getItem('token');

            try {
                const res = await fetch(`${API_URL}/posts/`, {
                    headers: {
                        'authorization': `Bearer ${token}`
                    }
                });

                const data = await res.json();
                const posts = data.posts || [];

                const container = document.getElementById('posts-container');
                if (posts.length === 0) {
                    container.innerHTML = '<p style="color: #999;">아직 작성한 글이 없습니다.</p>';
                } else {
                    container.innerHTML = posts.map(post => `
                        <div class="post-item">
                            <h3>${post.title}</h3>
                            <p>${post.preview}</p>
                            <div class="post-meta">
                                <span>조회수: ${post.view_count || 0}</span>
                                <span>가격: ${post.access_type === 'paid_single' ? '₩' + post.single_price : post.access_type === 'premium_only' ? '구독자 전용' : '무료'}</span>
                                <span>발행일: ${new Date(post.published_at).toLocaleDateString('ko-KR')}</span>
                            </div>
                        </div>
                    `).join('');
                }

                document.getElementById('posts-list').style.display = 'block';
                updateStats(posts);
            } catch (err) {
                console.error('글 목록 로드 실패:', err);
            }
        }

        // 통계 업데이트
        function updateStats(posts) {
            const totalPosts = posts.length;
            const totalSales = posts
                .filter(p => p.access_type === 'paid_single')
                .reduce((sum, p) => sum + (p.single_price || 0), 0);

            document.getElementById('total-posts').textContent = totalPosts;
            document.getElementById('total-sales').textContent = '₩' + totalSales.toLocaleString('ko-KR');
            document.getElementById('stats').style.display = 'block';
        }

        // ETF 데이터 업데이트 함수 (추가)
        async function updateAllEtfData() {
            const token = localStorage.getItem('token');
            const statusEl = document.getElementById('etf-status');
            statusEl.textContent = '데이터 수집 중...';
            try {
                const res = await fetch(`${API_URL}/admin/update-etf`, { 
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                if (res.ok) { 
                    showMessage('✅ ETF 데이터 업데이트 성공!', 'success'); 
                    statusEl.textContent = '마지막 업데이트: ' + new Date().toLocaleTimeString(); 
                }
                else throw new Error('업데이트 실패');
            } catch (err) { 
                showMessage('오류: ' + err.message, 'error'); 
                statusEl.textContent = '업데이트 실패'; 
            }
        }

        // 메시지 표시
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            setTimeout(() => {
                messageEl.className = 'message';
            }, 5000);
        }

        // 페이지 로드 시 토큰 확인
        window.addEventListener('load', () => {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('post-form').style.display = 'flex';
                loadPosts();
            }
        });
    </script>
</body>
</html>
